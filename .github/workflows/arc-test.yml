name: ARC test
on: workflow_dispatch
jobs:
  test-x86:
    runs-on: arc-x86
    steps:
      - run: echo "x86_64 runner on OpenShift"
      - run: uname -m
      - run: cat /etc/os-release

  test-arm:
    runs-on: arc-arm
    steps:
      - run: echo "aarch64 runner on OpenShift"
      - run: uname -m
      - run: cat /etc/os-release

  test-buildah-vfs:
    runs-on: arc-x86
    env:
      BUILDAH_ISOLATION: chroot
      STORAGE_DRIVER: vfs
    steps:
      - name: Build a trivial image
        run: |
          echo 'FROM registry.access.redhat.com/ubi10/ubi-minimal
          RUN echo "hello from buildah"' | buildah bud -t localhost/test-image -f - .
      - name: Verify image exists
        run: buildah images localhost/test-image

  test-buildah-overlay:
    runs-on: arc-x86
    env:
      BUILDAH_ISOLATION: chroot
      STORAGE_DRIVER: overlay
    steps:
      - name: Build a trivial image
        run: |
          echo 'FROM registry.access.redhat.com/ubi10/ubi-minimal
          RUN echo "hello from buildah"' | buildah bud -t localhost/test-image -f - .
      - name: Verify image exists
        run: buildah images localhost/test-image
